<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="640" viewBox="0 0 1030 640"><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="32" y="36" font-size="24" fill="#17212b" text-anchor="start">Population repair versus damage — all 256 cases, both seeds</text><text x="32" y="64" font-size="15" fill="#17212b" text-anchor="start">Four-endpoint family: paired-case bootstrap, 10,000 draws, two-sided 98.75% intervals.</text><text x="32" y="104" font-size="17" fill="#17212b" text-anchor="start">Baseline W: 83 target/format/seed rows in 63 distinct cases.</text><text x="32" y="134" font-size="17" fill="#17212b" text-anchor="start">Targeted refresh repaired 36 W rows in 28 distinct cases.</text><line x1="735.0" y1="180" x2="735.0" y2="450" stroke="#82909b" stroke-dasharray="4 4"/><text x="32" y="205" font-size="15" fill="#17212b" text-anchor="start">Repair contrast B − C (all target opportunities)</text><text x="32" y="228" font-size="14" fill="#53626d" text-anchor="start">+0.3689 pp  [+0.2062, +0.5642]</text><line x1="774.6349413298566" y1="205" x2="843.4745762711863" y2="205" stroke="#176c80" stroke-width="3"/><circle cx="805.9256844850064" cy="205" r="5" fill="#176c80"/><text x="32" y="273" font-size="15" fill="#17212b" text-anchor="start">Net joint error B − A (all joint responses)</text><text x="32" y="296" font-size="14" fill="#53626d" text-anchor="start">-0.8097 pp  [-1.0403, -0.5792]</text><line x1="535.0" y1="273" x2="623.6571056062581" y2="273" stroke="#176c80" stroke-width="3"/><circle cx="579.3285528031292" cy="273" r="5" fill="#176c80"/><text x="32" y="341" font-size="15" fill="#17212b" text-anchor="start">New direct error (all direct responses)</text><text x="32" y="364" font-size="14" fill="#53626d" text-anchor="start">+0.1546 pp  [+0.0875, +0.2319]</text><line x1="751.818774445893" y1="341" x2="779.5893089960886" y2="341" stroke="#176c80" stroke-width="3"/><circle cx="764.7262059973924" cy="341" r="5" fill="#176c80"/><text x="32" y="409" font-size="15" fill="#17212b" text-anchor="start">New joint error (all joint responses)</text><text x="32" y="432" font-size="14" fill="#53626d" text-anchor="start">+0.4706 pp  [+0.3594, +0.5941]</text><line x1="804.1003911342893" y1="409" x2="849.2112125162972" y2="409" stroke="#176c80" stroke-width="3"/><circle cx="825.4823989569751" cy="409" r="5" fill="#176c80"/><text x="735.0" y="470" font-size="13" fill="#17212b" text-anchor="middle">0</text><text x="505" y="470" font-size="13" fill="#17212b" text-anchor="middle">−1.20 pp</text><text x="965" y="470" font-size="13" fill="#17212b" text-anchor="middle">+1.20 pp</text><text x="32" y="517" font-size="13" fill="#17212b" text-anchor="start">Positive repair contrast favors B; negative net-error change favors B. New-error endpoints are harm, not net error.</text><text x="32" y="541" font-size="13" fill="#17212b" text-anchor="start">Harm denominators include every scheduled response, not only post-intervention eligible cases.</text><text x="32" y="580" font-size="18" fill="#17212b" text-anchor="start">All strong-repair thresholds satisfied: False</text><text x="32" y="612" font-size="13" fill="#17212b" text-anchor="start">The all-case table separately reports conditional harm, improvements, invalidity, both formats, and both seeds.</text></g></svg>