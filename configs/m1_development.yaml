run:
  name: 2026-08-11-llama-m1-development
  mode: full
  seed: 20260803

model:
  id: meta-llama/Meta-Llama-3.1-8B-Instruct
  revision: 0e9e39f249a16976918f6564b8830bc894c89659
  torch_dtype: bfloat16
  allow_fp16_fallback: false
  quantization: none
  min_gpu_memory_mib: 23000
  device_map: auto
  trust_remote_code: false

data:
  dataset: allenai/ValuePrism
  dataset_config: valence
  dataset_revision: d439ca90825e5b4e5ef97798d9b5950e16ba7065
  m0_common_train_manifest: manifest_train_common.csv
  m0_dev_manifest: manifest_dev.csv
  m0_confirmatory_manifest: manifest_confirmatory.csv
  pilot_manifest_dir: manifests/m1

pilot:
  train_rows: 1500
  select_boards: 75
  eval_boards: 125

prompt:
  chat_template_source: pinned_tokenizer_revision
  add_generation_prompt: true
  stop_conditions: not_applicable_sequence_scoring_without_generation
  system_template: You judge how one named moral consideration bears on an action in context. Follow the requested answer mapping exactly.
  schemes:
    primary:
      symbols: [A, B]
      joint_user_template: |-
        Situation and action: {situation}
        Named consideration: {consideration}
        Question: In this specific context, does the named consideration support or oppose the action?
        {mapping_instruction}
      situation_user_template: |-
        Situation and action: {situation}
        The named consideration is withheld. Decide only from the situation-level information.
        {mapping_instruction}
      consideration_user_template: |-
        Named consideration: {consideration}
        The situation and action are withheld. Decide only from the consideration-level information.
        {mapping_instruction}
    transfer:
      symbols: ["1", "2"]
      joint_user_template: |-
        Consider this action in context: {situation}
        Focus only on this consideration: {consideration}
        Does that consideration count in favor of the action or against it here?
        {mapping_instruction}
      situation_user_template: |-
        Consider this action in context: {situation}
        No consideration text is supplied. Use only the situation.
        {mapping_instruction}
      consideration_user_template: |-
        Focus on this consideration: {consideration}
        No situation text is supplied. Use only the consideration.
        {mapping_instruction}

cache:
  batch_size: 8
  chunk_size: 64
  activation_dtype: float16
  representations: [joint, situation, consideration]
  schemes: [primary, transfer]
  sync_every_chunks: 1

analysis:
  selection_metric: mean_mirrored_pairwise
  primary_probe: difference_in_means
  logistic_c_grid: [0.01, 0.1, 1.0, 10.0]
  logistic_max_iter: 3000
  permutations: 200
  bootstrap_replicates: 2000
  confidence_level: 0.95
  primary_checkerboard_metric: standardized_interaction_contrast
  text_baseline: sbert_interaction
  checkerboard_inference: dyadic_robust
  practical_effect_sd: 0.30
  minimum_interpretable_boards: 75
