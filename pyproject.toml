[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-of-truth"
version = "1.1.2"
description = "Reproducible factual-truth control and ValuePrism leakage methodology"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29,<7", "jupyter>=1.1,<2", "nbconvert>=7.16,<8"]
truth-full = [
  "accelerate==1.10.1",
  "huggingface-hub==0.34.4",
  "PyYAML==6.0.2",
  "tqdm==4.67.1",
  "transformers==4.56.2",
]
valueprism-full = [
  "datasets>=3.6,<4",
  "huggingface-hub>=0.34,<1",
  "sentence-transformers>=3.4,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
