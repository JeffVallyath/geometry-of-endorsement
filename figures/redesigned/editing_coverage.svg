  </g>
  <g id="text_12">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515b63" x="13.86" y="31.99875" transform="rotate(-0 13.86 31.99875)">Gemma: 64 situations · Qwen: 32 situations · seeds remain repeated measurements</text>
  </g>
  <g id="text_13">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #20272c" transform="translate(13.86 230.8075)">98.75% paired-situation intervals; triangles: separate seed effects.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #20272c" transform="translate(13.86 241.6075)">Broader minus narrower training; all-question success after 2/3 updates.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #20272c" transform="translate(13.86 252.4075)">Single-edit training only; these relative gains are not broad external generalization.</text>
  </g>
